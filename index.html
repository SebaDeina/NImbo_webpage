    #splash{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;

    #root{position:relative;z-index:1}
  </style>

<body>
  <div id="splash" aria-live="polite" aria-busy="true">

  </div>
  <script>
    /* el sitio usa el diseño blanco: el splash índigo queda solo para /robots, /propuesta y /links */
    (function () {
      var p = location.pathname
      if (!(p.indexOf('/robots') === 0 || p.indexOf('/propuesta') === 0 || p === '/links' || location.hostname.indexOf('robots.') === 0))
        document.getElementById('splash').remove()
    })()
  </script>
